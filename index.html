<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP Grupo Novax</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: app de escritorio tipo ERPNext — barra superior fija, portada de mosaicos, pantallas de informe de una columna. */
:root{
  --bg:#f6f4f1; --surf:#ffffff; --surf2:#efece7; --line:#dcd6cd; --ink:#1d1a17; --ink2:#6b635a;
  --brand:#8c1a1a; --brand2:#b23a3a; --brand-ink:#ffffff; --aqua:#1f6f8b;
  --pos:#1c8a5e; --warn:#b7791f; --crit:#c0392b;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131a; --surf:#1e1b23; --surf2:#27232e; --line:#3a3442; --ink:#f1ecf2; --ink2:#a89fa9;
  --brand:#c74a4a; --brand2:#e06666; --brand-ink:#ffffff; --aqua:#5fb3cf; --pos:#4fc48f; --warn:#e2a93b; --crit:#ef6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131a; --surf:#1e1b23; --surf2:#27232e; --line:#3a3442; --ink:#f1ecf2; --ink2:#a89fa9;
  --brand:#c74a4a; --brand2:#e06666; --brand-ink:#ffffff; --aqua:#5fb3cf; --pos:#4fc48f; --warn:#e2a93b; --crit:#ef6b5e; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--aqua)}
.num{font-variant-numeric:tabular-nums}
/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surf);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top .logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em}
.top .logo i{width:26px;height:26px;border-radius:7px;background:var(--brand);display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:13px;font-weight:700}
.top select{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surf2);color:var(--ink);padding:0 8px;font:inherit;max-width:52vw}
.top .bcv{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.top .bcv b{color:var(--ink);font-family:var(--mono)}
.top .sp{flex:1}
.top .user{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.demo{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:1px 8px}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 60px;padding-inline:16px}
.crumb{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2);margin-bottom:10px;flex-wrap:wrap}
.crumb button{border:0;background:none;color:var(--aqua);padding:0;font-weight:600}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
h2{font-size:17px;margin:0 0 4px}
h3{font-size:14.5px;margin:0 0 3px}
.sub{color:var(--ink2);font-size:13px;margin-bottom:14px}
/* portada */
.hello{display:flex;gap:14px;align-items:center;margin:8px 0 18px;flex-wrap:wrap}
.hello .mark{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.hello .t h1{font-size:24px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surf);border-radius:9px;padding:9px 12px;color:var(--ink2);margin-bottom:18px}
.search kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin:18px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--surf);border-radius:var(--r);padding:12px 12px 10px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:92px;transition:border-color .12s}
.tile:hover{border-color:var(--brand)}
.tile .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:var(--surf2);color:var(--brand);font-family:var(--mono);font-weight:600}
.tile .n{font-weight:600;font-size:13px}
.tile .d{font-size:11.5px;color:var(--ink2);line-height:1.3}
.tile.new .ic{background:var(--brand);color:#fff}
.tile.off{opacity:.55}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 7px}
.tag.new{background:var(--brand);color:#fff}
.tag.off{background:var(--surf2);color:var(--ink2)}
.tag.pos{background:color-mix(in srgb,var(--pos) 18%,transparent);color:var(--pos)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.crit{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit)}
/* selector de productos en la factura */
.picker{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--surf2);padding:6px}
.pk-cat{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700;padding:8px 6px 4px;display:flex;gap:8px;align-items:center}
.pk{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto 34px;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:7px 9px;margin-bottom:4px}
.pk:hover{border-color:var(--brand)}
.pk.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surf))}
.pk .n{font-size:12.5px;font-weight:600;min-width:0}
.pk .n small{display:block;font-weight:400;color:var(--ink2);font-size:11px}
.pk .pr{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--brand);text-align:right;white-space:nowrap}
.pk .pr small{display:block;color:var(--ink2);font-weight:400;font-size:10.5px}
.pk .q{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
/* modal de registro */
.scrim{position:fixed;inset:0;background:rgba(10,8,12,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal{background:var(--surf);border:1px solid var(--line);border-radius:14px;width:min(620px,100%);padding:18px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{display:flex;justify-content:space-between;align-items:center}
.modal .x{border:1px solid var(--line);background:var(--surf2);border-radius:7px;width:30px;height:30px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media (max-width:560px){.fg{grid-template-columns:minmax(0,1fr)}}
.fg .f.w{grid-column:1/-1}
.fg select,.fg input,.fg textarea{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surf2);color:var(--ink);padding:0 10px;font:inherit;width:100%;min-width:0}
.fg textarea{height:64px;padding:8px 10px}
.lines{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:6px 0 10px}
.lines .ln{display:grid;grid-template-columns:minmax(0,1fr) 64px 96px 100px 30px;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px}
.lines .ln>*{min-width:0}
.lines .ln.pg{grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr) 30px}
@media (max-width:620px){.lines .ln.pg{grid-template-columns:minmax(0,1fr) 90px 30px;grid-template-areas:'a q x' 'p p x'}.lines .ln.pg>:nth-child(3){grid-area:p;font-size:11.5px}}
.lines .ln .x,.lines .ln button{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surf2);color:var(--ink);font-size:13px;display:grid;place-items:center}
@media (max-width:620px){.lines .ln{grid-template-columns:minmax(0,1fr) 56px 30px;grid-template-areas:'a q x' 'p t x'}.lines .ln>:nth-child(1){grid-area:a}.lines .ln>:nth-child(2){grid-area:q}.lines .ln>:nth-child(3){grid-area:p;font-size:12px;color:var(--ink2)}.lines .ln>:nth-child(4){grid-area:t}.lines .ln>:nth-child(5){grid-area:x;align-self:center}.lines .ln.h{display:none}}
.lines .ln:last-child{border-bottom:0}
.lines .ln.h{background:var(--surf2);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600}
.lines input,.lines select{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surf);color:var(--ink);padding:0 6px;font:inherit;width:100%;min-width:0}
.tot-row{display:flex;justify-content:flex-end;gap:16px;font-weight:700;font-size:15px;margin-bottom:6px}
.tot-row small{color:var(--ink2);font-weight:400}
.nuevo{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.nuevo .btn{border-color:var(--brand);color:var(--brand)}
.nuevo .btn.p{color:#fff}
/* barra de mando */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:4px 0 14px}
.f{display:flex;flex-direction:column;gap:3px}
.f>label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.f select,.f input{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surf);color:var(--ink);font-size:13px;padding:0 9px;min-width:140px;font:inherit}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);height:30px}
.acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{height:30px;border:1px solid var(--line);background:var(--surf);border-radius:7px;padding:0 11px;font-size:12.5px;font-weight:600}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:hover{filter:brightness(.97)}
/* cabecera de informe */
.head{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:12px;background:linear-gradient(110deg,var(--brand),var(--brand2));color:#fff;margin-bottom:14px;flex-wrap:wrap}
.head .lg{height:46px;min-width:46px;padding:0 10px;background:rgba(255,255,255,.93);color:var(--brand);border-radius:8px;display:grid;place-items:center;font-weight:700}
.head .e{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:600}
.head h2{color:#fff;font-size:21px;margin:2px 0 0}
.head .s{font-size:12.5px;opacity:.9;margin-top:2px}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;border:1px solid}
.aviso.ok{background:color-mix(in srgb,var(--pos) 10%,transparent);border-color:color-mix(in srgb,var(--pos) 35%,transparent)}
.aviso.mal{background:color-mix(in srgb,var(--crit) 10%,transparent);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.aviso.info{background:color-mix(in srgb,var(--aqua) 10%,transparent);border-color:color-mix(in srgb,var(--aqua) 35%,transparent)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--aqua);border-radius:11px;padding:13px 15px;min-width:0}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:600;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.kpi .fo{font-size:11.5px;color:var(--ink2);margin-top:4px}
.sec{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:14px;min-width:0}
.sec .d{font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th,.t td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.t th:first-child,.t td:first-child{text-align:left;white-space:normal}
.t thead th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.t tbody tr:last-child td{border-bottom:0}
.t .g>td{font-weight:700}
.t .paso>td{background:var(--surf2);font-weight:700}
.t .tot>td{border-top:2px solid var(--brand);font-weight:800;font-size:14px}
.t .neg{color:var(--crit)}
.t .cta{cursor:pointer}
.t .cta:hover>td{background:var(--surf2)}
.t .ind1>td:first-child{padding-left:26px;color:var(--ink2)}
.t .bloque>td{background:var(--brand);color:#fff;font-weight:700;letter-spacing:.03em}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.tabs .sp{flex:1}
.tabs .av{align-self:center;font-size:11.5px;color:var(--warn)}
.bars{display:flex;flex-direction:column;gap:9px}
.brow{display:grid;grid-template-columns:minmax(110px,180px) 1fr;gap:12px;align-items:center}
.brow .n{font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.brow .n small{display:block;font-weight:400;color:var(--ink2);font-size:11px}
.brow .tr{position:relative;height:28px;background:var(--surf2);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.brow .fi{position:absolute;inset:0 auto 0 0;border-radius:7px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.brow .vv{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700}
.brow .vv.in{color:#fff}
.chart svg{width:100%;height:auto;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:860px){.three{grid-template-columns:minmax(0,1fr)}}
.ana{border-left:4px solid var(--warn)}
.ana .lect{font-size:14px;line-height:1.55;margin-bottom:12px}
.ana ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.ana li{position:relative;padding-left:18px;font-size:13px;color:var(--ink2);line-height:1.5}
.ana li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%}
.ana .bien li::before{background:var(--pos)}
.ana .ojo li::before{background:var(--warn)}
.cab{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;background:var(--surf2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surf);min-width:0}
.card .k{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.card .v{font-size:20px;font-weight:700;margin-top:3px}
.card .m{font-size:12px;color:var(--ink2);margin-top:4px}
.perm{display:grid;grid-template-columns:160px repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:720px;font-size:12px}
.perm>div{background:var(--surf);padding:7px 8px}
.perm .h{background:var(--surf2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.perm .y{color:var(--pos);font-weight:700;text-align:center}
.perm .n{color:var(--ink2);text-align:center;opacity:.5}
.perm .r{color:var(--warn);font-weight:700;text-align:center}
.chat{border:1px solid var(--line);border-radius:12px;background:var(--surf);padding:14px;display:flex;flex-direction:column;gap:10px;max-width:720px}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.45}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:3px}
.msg.j{align-self:flex-start;background:var(--surf2);border-bottom-left-radius:3px}
.msg.j b{color:var(--brand)}
.ck-hbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--surf2);margin:4px 0 12px}.ck-hbar .ok{background:#37b36b}.ck-hbar .lo{background:#e6a417}.ck-hbar .or{background:#e07b1a}.ck-hbar .z{background:#d0503f}
.ck-ag{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media (max-width:700px){.ck-ag{grid-template-columns:repeat(2,minmax(0,1fr))}}.ck-agc{border:1px solid var(--line);border-left-width:3px;border-radius:11px;padding:10px 12px;background:var(--surf);cursor:pointer}.ck-agc span{display:block;font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.02em}.ck-agc b{font-size:15px}.ck-agc.ok{border-left-color:#37b36b}.ck-agc.lo{border-left-color:#e6a417}.ck-agc.or{border-left-color:#e07b1a}.ck-agc.z{border-left-color:#d0503f}.ck-agc.on{outline:2px solid var(--acc)}
.ck-chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.ck-chip{border:1px solid var(--line);background:var(--surf);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--ink)}.ck-chip em{font-style:normal;background:var(--surf2);border-radius:10px;padding:0 6px;margin-left:4px;font-weight:600}.ck-chip.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.ck-fila{cursor:pointer}.ck-fila:hover td{background:var(--surf2)}.ck-fila.open td{background:color-mix(in srgb,var(--acc) 6%,transparent)}.ck-caret{color:var(--ink2);font-size:11px;width:12px;display:inline-block}.ck-nm{font-weight:600;color:var(--acc)}
.ck-est{display:inline-block;padding:2px 10px;border-radius:11px;font-size:11px;font-weight:600;white-space:nowrap}.ck-est.venc{background:#fdecea;color:#c0392b}.ck-est.ok{background:#eaf4fd;color:#1f6fa8}.ck-est.hoy{background:#fdf3e5;color:#b25e00}
.ck-det td{background:var(--surf2)!important;padding:8px 14px 12px 36px!important}.ck-mini{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surf);border-radius:10px;overflow:hidden}.ck-mini th{font-size:10.5px;text-transform:uppercase;color:var(--ink2);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}.ck-mini td{padding:7px 10px;border-bottom:1px solid var(--line)}.ck-mini tr:last-child td{border-bottom:0}
.crm{display:grid;grid-template-columns:260px minmax(0,1fr) 280px;gap:12px}@media (max-width:1000px){.crm{grid-template-columns:minmax(0,1fr)}}
.cv{display:flex;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}.cv:hover{background:var(--surf2)}.cv.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent)}.cv .av{width:34px;height:34px;border-radius:50%;background:var(--surf2);display:grid;place-items:center;font-weight:600;flex:none}
.chatbox{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:4px 2px}.qr{display:flex;gap:6px;flex-wrap:wrap}.qr button{font-size:12px;height:28px;padding:0 10px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;z-index:50;opacity:0;transition:opacity .15s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.posg{display:grid;grid-template-columns:1fr 340px;gap:12px}
@media (max-width:860px){.posg{grid-template-columns:minmax(0,1fr)}}
.prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}

        auditar(soloDeuda?'Creó deuda':'Cargo a persona',q,fmt(m)+(cu?' desde '+cu:'')+' · '+(ds||''),'sensible');NOTIF.unshift({a:'Keyner (dueño)',t:`${usuarioActual()[0]} cargó ${fmt(m)} a ${q}${cu?' (salió de '+cu+')':' (solo deuda, sin salida de dinero)'}${ds?' · '+ds:''}. ${q} ${esTrab?'lo tiene como préstamo':'le debe a Novax '+fmt(saldoAccionista(q))}.`,f:ahora()});guardar();toast(fmt(m)+' cargados a '+q+' · es préstamo, no gasto');S.gastoA=null;S.gastoDeuda=false;go('cxc');return}

function pintarModal(){const f=formHTML(S.modal);if(!f)return;let sc=document.querySelector('.scrim');if(!sc){sc=document.createElement('div');sc.className='scrim';sc.onclick=e=>{if(e.target===sc)cerrar()};document.body.appendChild(sc)}

  $('#okm').onclick=()=>{S.keep=false;f.go();if(S.modal&&!S.keep)cerrar()}}

}

(function init(){

  const md=$('#modo');md.value=S.modo;md.onchange=e=>{S.modo=e.target.value;reiniciar()};
  const sel=$('#empresa');sel.innerHTML=EMPRESAS.map(e=>`<option value="${e.id}">${esc(e.n)}</option>`).join('');sel.value=S.emp;
  sel.onchange=e=>{S.emp=e.target.value;render()};
  const rs=$('#rol');const OPC=ROLES.flatMap(r=>r==='Vendedor'?VENDEDORES.map(v=>['Vendedor|'+v,'Vendedor · '+v]):r==='Despacho'?DESPACHADORES.map(v=>['Despacho|'+v,'Despacho · '+v]):[[r,r]]);rs.innerHTML=OPC.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('');rs.value=S.rol==='Vendedor'?'Vendedor|'+yo():S.rol==='Despacho'?'Despacho|'+yoDesp():S.rol;rs.onchange=e=>{const [r,q]=e.target.value.split('|');S.rol=r;if(r==='Vendedor'&&q)S.vend=q;if(r==='Despacho'&&q)S.desp=q;pintarQuien();if(S.route!=='home'&&permiso(S.route)==='N')S.route='home';render()};pintarQuien();
  const d=new Date();$('#hoy').textContent=d.toLocaleDateString('es-VE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const r=location.hash.replace('#','');if(r)S.route=r;
  render();
